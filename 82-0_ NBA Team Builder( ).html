function histPage(){$('#v').innerHTML=`<h2>History</h2><p class=mu>${PN}'s past teams · saved automatically on this device.</p>`+(H.length?H.map((h,n)=>{const op=HX==h.id;return`<div class="pn ${h.l==0?'gold':''}"><div class=hh data-a="hx" data-v="${h.id}"><div><div class=hr>${h.w}-${h.l}${h.l==0?' 👑':''}</div><small class=mu>${h.sy?yl(h.sy)+' league · ':''}${h.d}</small></div><div class=hs><span>OVR<br><b>${h.t.ovr}</b></span><span>CHEM<br><b>${h.t.ch}</b></span><span>PPG<br><b>${h.ppg}</b></span><span>STREAK<br><b>${h.bs}</b></span></div></div>${op?`<div style="margin-top:10px">${h.r.filter(Boolean).map((p,i)=>`<div class="rw ${tier(p.ovr)[1]}"><b class=sp>${i<5?SL[i]:'BN'}</b><div class=nm><b>${p.name}</b><small>${p.pos} · ${yl(p.yr)} ${p.team}</small></div><span class=ob>${p.ovr}</span></div>`).join('')}<p class=mu>OFF ${h.t.off} · DEF ${h.t.def} · DEPTH ${h.t.dep} · Opp PPG ${h.opp}</p><button class="btn g sm" data-a="hdel" data-v="${h.id}">DELETE ENTRY</button></div>`:'<small class=mu>Tap to view roster</small>'}</div>`}).join(''):`<div class="pn c">No seasons yet. Simulate a season from My Team and it will be saved here.</div>`)}
G.hx=v=>{HX=HX==v?null:v;render()};G.hdel=v=>{H=H.filter(h=>h.id!=v);save();render()};
G.prof=n=>{if(S.busy)return;save();loadP(n);sel=PE=null;render();toast('Playing as '+n)};
G.newp=()=>{const n=($('#nn').value||'').replace(/[^\w \-]/g,'').trim().slice(0,16);if(!n)return toast('Enter a name');if(S.busy)return;save();if(IDX.includes(n)){loadP(n)}else{loadP(n);IDX.push(n)}sel=PE=null;save();render();toast('Playing as '+n)};
G.skip=()=>{if(S.busy)return;S={step:'year',busy:false};save();render()};
G.strict=()=>{if(S.busy)return;P.strict=P.strict===false;save();S.step=S.step=='pick'?'year':S.step;S.tres=false;render()};
document.addEventListener('change',e=>{if(e.target.id=='sy'){P.simYr=+e.target.value;save();render()}});
render();
</script></body></html>
